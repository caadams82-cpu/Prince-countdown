<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prince's Countdown</title>

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #2563eb 0%, #111827 45%, #7f1d1d 100%);
}

/* Comic texture */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size: 20px 20px;
    opacity: 0.4;
    animation: moveDots 30s linear infinite;
}

@keyframes moveDots {
    from { transform: translateY(0); }
    to { transform: translateY(100px); }
}

/* Decorative web patterns */
.web {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
}

.web:before,
.web:after {
    content:"";
    position:absolute;
    inset:40px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
}

.web:after {
    inset:90px;
}

.top-left {
    top:-120px;
    left:-120px;
}

.top-right {
    top:-120px;
    right:-120px;
}


.container {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:2;
}


.panel {

    max-width:950px;
    width:100%;

    padding:45px;

    background:rgba(0,0,0,0.35);

    border-radius:30px;

    border:1px solid rgba(255,255,255,0.25);

    backdrop-filter:blur(12px);

    text-align:center;

    box-shadow:
        0 0 40px rgba(0,0,0,0.5);

}


h1 {

    font-family:'Bangers', cursive;

    font-size:5rem;

    letter-spacing:5px;

    color:#ffd54f;

    text-shadow:
        4px 4px 0 #111;

}


.subtitle {

    margin-top:15px;

    font-size:1.2rem;

}


.timer {

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;

    margin-top:45px;

}


.card {

    padding:25px 15px;

    border-radius:20px;

    background:
        linear-gradient(145deg,#2563eb,#1e3a8a);

    box-shadow:
        0 0 25px rgba(37,99,235,.6);

    animation:float 3s ease-in-out infinite;

}


.card:nth-child(even) {

    background:
        linear-gradient(145deg,#ef4444,#991b1b);

}


@keyframes float {

    50% {
        transform:translateY(-8px);
    }

}


.number {

    font-size:4rem;

    font-weight:900;

}


.label {

    margin-top:8px;

    letter-spacing:3px;

    font-size:.8rem;

}


.message {

    margin-top:35px;

    font-size:1rem;

    opacity:.85;

}


/* skyline */

.skyline {

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:150px;

    background:
    linear-gradient(to top,#020617 30%,transparent),
    repeating-linear-gradient(
        90deg,
        #020617 0 40px,
        transparent 40px 60px
    );

    opacity:.9;

}


@media(max-width:700px){

    h1 {
        font-size:3.5rem;
    }

    .timer {
        grid-template-columns:repeat(2,1fr);
    }

    .number {
        font-size:3rem;
    }

    .panel {
        padding:30px 20px;
    }

}

</style>

</head>


<body>

<div class="web top-left"></div>
<div class="web top-right"></div>


<div class="container">

<div class="panel">

<h1>COUNTDOWN!</h1>

<div class="subtitle">
A special mission for <strong>Prince</strong><br><br>
Friday 31 July 2026 • 09:10 BST
</div>


<div class="timer">

<div class="card">
<div class="number" id="days">0</div>
<div class="label">Days</div>
</div>

<div class="card">
<div class="number" id="hours">0</div>
<div class="label">Hours</div>
</div>

<div class="card">
<div class="number" id="minutes">0</div>
<div class="label">Minutes</div>
</div>

<div class="card">
<div class="number" id="seconds">0</div>
<div class="label">Seconds</div>
</div>

</div>


<div class="message">
⚡ Every second brings the adventure closer ⚡
</div>


</div>

</div>


<div class="skyline"></div>


<script>

// Target: 09:10 UK BST (UTC+1)
// Equivalent UTC time: 08:10

const target = new Date("2026-07-31T08:10:00Z");


function updateCountdown(){

    const now = new Date();

    let difference = target - now;


    if(difference <= 0){

        document.querySelector(".panel").innerHTML = `
        <h1>IT'S TIME!</h1>
        <p style="font-size:1.5rem">
        The mission begins 🎉
        </p>
        `;

        return;

    }


    const days = Math.floor(difference / (1000*60*60*24));

    difference %= (1000*60*60*24);


    const hours = Math.floor(difference / (1000*60*60));

    difference %= (1000*60*60);


    const minutes = Math.floor(difference / (1000*60));

    difference %= (1000*60);


    const seconds = Math.floor(difference / 1000);



    document.getElementById("days").textContent = days;

    document.getElementById("hours").textContent = hours.toString().padStart(2,"0");

    document.getElementById("minutes").textContent = minutes.toString().padStart(2,"0");

    document.getElementById("seconds").textContent = seconds.toString().padStart(2,"0");

}


updateCountdown();

setInterval(updateCountdown,1000);


</script>


</body>
</html>
